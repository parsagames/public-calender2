name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Pillow and npm packages
        run: |
          python3 -m pip install pillow --break-system-packages
          npm install

      - name: Prepare web files
        run: python3 prepare_android.py web

      - name: Add Android platform
        run: npx cap add android

      - name: Icon, permissions, version
        run: python3 prepare_android.py android

      - name: Check Android SDK
        run: python3 prepare_android.py sdk

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../amiralmomenin-calendar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amiralmomenin-calendar-apk
          path: amiralmomenin-calendar.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: amiralmomenin-calendar.apk
