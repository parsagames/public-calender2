name: Build Release (Myket / Bazaar)

# فقط دستی اجرا می‌شود: Actions ← Build Release ← Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Pillow and npm packages
        run: |
          python3 -m pip install pillow --break-system-packages
          npm install

      - name: Prepare web files
        run: python3 prepare_android.py web

      - name: Add Android platform
        run: npx cap add android

      - name: Icon, permissions, version
        run: python3 prepare_android.py android

      - name: Check Android SDK
        run: python3 prepare_android.py sdk

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: python3 prepare_android.py sign

      - name: Build signed release APK (3 tries, in case Maven is busy)
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon --stacktrace && ok=1 && break
            echo "attempt $i failed - waiting 90s"; sleep 90
          done
          [ "$ok" = "1" ] || exit 1
          cp app/build/outputs/apk/release/app-release.apk ../amiralmomenin-calendar-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amiralmomenin-calendar-release
          path: amiralmomenin-calendar-release.apk
          retention-days: 90
